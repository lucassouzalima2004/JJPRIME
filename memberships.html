<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memberships — Jiujitsu Prime Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&family=Nunito:wght@900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/iframe-resizer/3.6.1/iframeResizer.min.js"><\/script>
<style>
:root,[data-theme="dark"]{
  --black:#0A0A0A;--charcoal:#1A1A1A;--charcoal-light:#242424;
  --gold:#C9A84C;--gold-light:#e0bc6a;--gold-dark:#a8882e;
  --offwhite:#F5F0E8;--offwhite-dim:#cec9c0;--text-muted:#888;
  --border:rgba(201,168,76,0.2);
  --font-display:'Cormorant Garamond',serif;
  --font-body:'DM Sans',sans-serif;
  --font-accent:'Bebas Neue',sans-serif;
  --nav-h:72px;--ease-out:cubic-bezier(0.16,1,0.3,1);
  --page-bg:#0A0A0A;--nav-scrolled-bg:rgba(10,10,10,0.88);
  --card-bg:#1A1A1A;--section-alt:#111111;
}
[data-theme="light"]{
  --black:#f3ede0;--charcoal:#ebe4d4;--charcoal-light:#e0d8c8;
  --gold:#8a6a00;--gold-light:#b08a10;--gold-dark:#5a4600;
  --offwhite:#1a1a1a;--offwhite-dim:#3a3028;--text-muted:#6b5e45;
  --border:rgba(100,80,20,0.25);
  --font-display:'Cormorant Garamond',serif;
  --font-body:'DM Sans',sans-serif;
  --font-accent:'Bebas Neue',sans-serif;
  --nav-h:72px;--ease-out:cubic-bezier(0.16,1,0.3,1);
  --page-bg:#f3ede0;--nav-scrolled-bg:rgba(243,237,224,0.95);
  --card-bg:#ffffff;--section-alt:#ebe4d4;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{background:var(--page-bg);color:var(--offwhite);font-family:var(--font-body);font-weight:300;line-height:1.6;overflow-x:hidden;transition:background .35s,color .35s;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
button{cursor:pointer;border:none;background:none;font-family:inherit}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--page-bg)}
::-webkit-scrollbar-thumb{background:var(--gold-dark);border-radius:2px}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:1000;height:var(--nav-h);display:flex;align-items:center;transition:background .4s,backdrop-filter .4s,box-shadow .4s;padding:0 40px;background:var(--nav-scrolled-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 1px 0 var(--border);}
.nav-inner{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:1200px;margin:0 auto}
.nav-logo{display:flex;align-items:center}
.logo-mark{display:inline-flex;flex-direction:column;align-items:center;line-height:1;gap:0}
.logo-mark .logo-top{font-family:'Nunito',sans-serif;font-weight:900;font-size:1.35rem;color:var(--offwhite);letter-spacing:-.02em;line-height:1}
.logo-mark .logo-bot{font-family:var(--font-body);font-weight:400;font-size:.48rem;color:var(--offwhite);letter-spacing:.45em;text-transform:uppercase;margin-top:1px;padding-left:.45em}
.nav-links{display:flex;align-items:center;gap:2rem}
.nav-links a{font-family:var(--font-body);font-size:.8rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--offwhite-dim);transition:color .2s;position:relative}
.nav-links a:hover,.nav-links a.active{color:var(--offwhite)}
.nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s}
.nav-links a:hover::after,.nav-links a.active::after{width:100%}
.nav-links a.active{color:var(--gold)}
.lang-switcher{display:flex;align-items:center;gap:4px;margin-left:2rem}
.lang-btn{font-family:var(--font-accent);font-size:.75rem;letter-spacing:.1em;color:var(--text-muted);padding:4px 8px;border-radius:3px;transition:color .2s,background .2s;cursor:pointer}
.lang-btn.active,.lang-btn:hover{color:var(--gold);background:rgba(201,168,76,.08)}
.lang-sep{color:rgba(201,168,76,.3);font-size:.6rem}
.theme-btn{background:none;border:1px solid var(--border);color:var(--text-muted);padding:5px 7px;border-radius:3px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,border-color .2s;line-height:1}
.theme-btn:hover{color:var(--gold);border-color:var(--gold)}
.theme-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
[data-theme="light"] .icon-sun{display:none}
[data-theme="dark"] .icon-moon{display:none}
html:not([data-theme]) .icon-moon{display:none}
.hamburger{display:none;flex-direction:column;gap:5px;cursor:pointer;padding:8px;z-index:1001}
.hamburger span{display:block;width:24px;height:1.5px;background:var(--offwhite);transition:.3s}
.mobile-nav{position:fixed;inset:0;background:var(--page-bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .4s}
.mobile-nav.open{opacity:1;pointer-events:all}
.mobile-nav a{font-family:var(--font-accent);font-size:2rem;letter-spacing:.15em;color:var(--offwhite);margin:.6rem 0;transition:color .2s}
.mobile-nav a:hover{color:var(--gold)}
.mobile-lang{display:flex;gap:1rem;margin-top:2rem}
.mobile-lang button{font-family:var(--font-accent);font-size:1rem;letter-spacing:.1em;color:var(--text-muted);background:none;border:none;cursor:pointer;transition:color .2s}
.mobile-lang button.active,.mobile-lang button:hover{color:var(--gold)}

/* PAGE HERO */
.page-hero{padding:calc(var(--nav-h) + 64px) 40px 56px;text-align:center;background:var(--charcoal);border-bottom:1px solid var(--border)}
.page-label{font-family:var(--font-accent);letter-spacing:.2em;font-size:.8rem;color:var(--gold);display:block;margin-bottom:1rem}
.page-title{font-family:var(--font-display);font-size:clamp(2.4rem,5vw,4rem);font-weight:600;color:var(--offwhite);line-height:1.1;position:relative;display:inline-block}
.page-title::after{content:'';position:absolute;bottom:-8px;left:0;width:100%;height:2px;background:var(--gold)}
.page-subtitle{font-family:var(--font-body);font-size:1rem;color:var(--offwhite-dim);margin-top:1.5rem;font-weight:300}

/* WIDGET AREA */
.widget-section{flex:1;padding:56px 0 80px;background:var(--page-bg)}
.widget-wrap{max-width:1100px;margin:0 auto;padding:0 40px}
.glofox-frame{background:var(--card-bg);border-radius:4px;overflow:hidden;border:1px solid var(--border);padding:24px}
[data-theme="light"] .glofox-frame{box-shadow:0 4px 24px rgba(0,0,0,.07)}

/* BACK LINK */
.back-link{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-body);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--text-muted);margin-bottom:32px;transition:color .2s}
.back-link:hover{color:var(--gold)}
.back-link svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

/* FOOTER */
footer{background:var(--charcoal);padding:64px 0 32px;border-top:1px solid var(--border);margin-top:auto}
.footer-inner{max-width:1200px;margin:0 auto;padding:0 40px}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;padding-top:32px;border-top:1px solid var(--border);margin-top:32px}
.footer-copy{font-size:.8rem;color:var(--text-muted)}
.footer-legal{display:flex;gap:1.5rem}
.footer-legal a{font-size:.8rem;color:var(--text-muted);transition:color .2s}
.footer-legal a:hover{color:var(--gold)}
.footer-top{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px}
.footer-brand p{font-size:.88rem;color:var(--offwhite-dim);line-height:1.7;margin-top:.5rem;max-width:260px}
.footer-col h4{font-family:var(--font-accent);letter-spacing:.15em;font-size:.75rem;color:var(--gold);margin-bottom:1.2rem}
.footer-col a,.footer-col p{display:block;font-size:.85rem;color:var(--offwhite-dim);margin-bottom:.6rem;transition:color .2s;line-height:1.5}
.footer-col a:hover{color:var(--offwhite)}
.footer-social{display:flex;gap:1rem;margin-top:1.2rem}
.social-link{width:36px;height:36px;border:1px solid var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:border-color .2s,color .2s;color:var(--text-muted)}
.social-link:hover{border-color:var(--gold);color:var(--gold)}
.social-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
@media(max-width:768px){
  #nav{padding:0 20px}
  .nav-links,.lang-switcher{display:none}
  .hamburger{display:flex}
  .theme-btn{display:none}
  .page-hero{padding:calc(var(--nav-h) + 40px) 24px 40px}
  .widget-wrap{padding:0 20px}
  .footer-top{grid-template-columns:1fr;gap:28px}
  .footer-bottom{flex-direction:column;gap:1rem;text-align:center}
  .glofox-frame{padding:12px}
}
</style>
</head>

<script>
const translations = {
  en:{
    nav_home:'Home', nav_about:'About', nav_programs:'Programs',
    nav_schedule:'Schedule', nav_memberships:'Memberships', nav_trial:'Free Trial',
    page_label:'Jiujitsu Prime Club', page_title:'Memberships', page_subtitle:'Choose the plan that fits your training — no hidden fees, no contracts.',
    back_home:'Back to Home',
    footer_desc:'A premium Brazilian Jiu-Jitsu academy in Venice, CA. Gracie-rooted, community-driven, recovery-focused.',
    footer_nav_title:'Navigation', footer_info_title:'Information', footer_contact_title:'Contact',
    footer_faq:'FAQ', footer_schedule:'Schedule', footer_privacy:'Privacy Policy', footer_terms:'Terms of Use',
    footer_copy:'© 2025 Jiujitsu Prime Club. All rights reserved.'
  },
  pt:{
    nav_home:'Início', nav_about:'Sobre', nav_programs:'Programas',
    nav_schedule:'Horários', nav_memberships:'Planos', nav_trial:'Aula Grátis',
    page_label:'Jiujitsu Prime Club', page_title:'Planos', page_subtitle:'Escolha o plano ideal para o seu treino — sem taxas ocultas, sem contratos.',
    back_home:'Voltar ao Início',
    footer_desc:'Uma academia de Jiu-Jitsu Brasileiro premium em Venice, CA. Raízes Gracie, comunidade, recuperação.',
    footer_nav_title:'Navegação', footer_info_title:'Informações', footer_contact_title:'Contato',
    footer_faq:'Perguntas Frequentes', footer_schedule:'Horários', footer_privacy:'Política de Privacidade', footer_terms:'Termos de Uso',
    footer_copy:'© 2025 Jiujitsu Prime Club. Todos os direitos reservados.'
  },
  es:{
    nav_home:'Inicio', nav_about:'Sobre', nav_programs:'Programas',
    nav_schedule:'Horarios', nav_memberships:'Membresías', nav_trial:'Clase Gratis',
    page_label:'Jiujitsu Prime Club', page_title:'Membresías', page_subtitle:'Elige el plan que se adapte a tu entrenamiento — sin cargos ocultos, sin contratos.',
    back_home:'Volver al Inicio',
    footer_desc:'Una academia premium de Jiu-Jitsu Brasileño en Venice, CA. Raíces Gracie, comunidad, recuperación.',
    footer_nav_title:'Navegación', footer_info_title:'Información', footer_contact_title:'Contacto',
    footer_faq:'Preguntas Frecuentes', footer_schedule:'Horarios', footer_privacy:'Política de Privacidad', footer_terms:'Términos de Uso',
    footer_copy:'© 2025 Jiujitsu Prime Club. Todos los derechos reservados.'
  }
};

let currentLang = 'en';
function setLang(lang){
  currentLang = lang;
  const t = translations[lang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const k = el.getAttribute('data-i18n');
    if(t[k] !== undefined) el.textContent = t[k];
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  document.querySelectorAll('.mobile-lang button').forEach(b => {
    b.classList.toggle('active', b.textContent.trim().toLowerCase() === lang);
  });
  localStorage.setItem('pclang', lang);
}

(function(){
  var t = localStorage.getItem('pct') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
  var lang = localStorage.getItem('pclang') || 'en';
  if(lang !== 'en') setTimeout(() => setLang(lang), 0);
})();

function toggleTheme(){
  var el = document.documentElement;
  var next = el.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  el.setAttribute('data-theme', next);
  localStorage.setItem('pct', next);
}

function toggleMenu(){
  document.getElementById('hamburger').classList.toggle('open');
  document.getElementById('mobileNav').classList.toggle('open');
}

iFrameResize({
  log: false, checkOrigin: false, tolerance: 10,
  sizeHeight: true, heightCalculationMethod: 'lowestElement',
  minHeight: 300, scrolling: 'auto'
}, '#glofox_2');
<\/script>
